<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>闲逛手记</title>
<style>
:root{
  --bg:#FBF7F9; --paper:#FFFFFF; --paper2:#FDFAFC;
  --ink:#2B2430; --ink2:#6B6270; --ink3:#A198A8;
  --line:#EFE6EC; --line2:#E4D8E0;
  --pink:#D6336C; --pink2:#B32A59; --pink-soft:#FDEAF1; --pink-line:#F7C9DC;
  --amber:#E07B39; --green:#3FA76A; --blue:#4C7DC4; --violet:#8B5FC0; --teal:#2E9CA8;
  --r:16px; --r2:12px;
  --sh:0 1px 2px rgba(90,60,80,.05), 0 6px 18px rgba(90,60,80,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{padding-bottom:40px}
#app{max-width:760px;margin:0 auto}

/* ---------- 顶栏 ---------- */
.top{padding:16px 16px 6px;display:flex;align-items:center;gap:9px}
.top .logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#F6A6C4,#D6336C);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;box-shadow:0 3px 10px rgba(214,51,108,.28)}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px;flex:1}
.iconbtn{width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--paper);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink2);cursor:pointer}
.iconbtn:active{background:var(--pink-soft)}
.subline{padding:0 16px 10px;font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.subline .pill{padding:2px 9px;border-radius:999px;background:var(--pink-soft);color:var(--pink2);font-size:11px;font-weight:600}

/* ---------- 页签 ---------- */
.tabs{display:flex;gap:7px;padding:2px 16px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:#F3ECF1;color:var(--ink2);
  font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.15s}
.tab.on{background:var(--pink);color:#fff;box-shadow:0 3px 10px rgba(214,51,108,.25)}

/* ---------- 通用 ---------- */
.wrap{padding:0 16px}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:11px;border:1px solid var(--line)}
.card.tight{padding:12px}
.sec-h{display:flex;align-items:center;gap:7px;margin:16px 0 9px;font-size:15px;font-weight:700}
.sec-h .bar{width:4px;height:15px;border-radius:2px;background:var(--pink)}
.muted{color:var(--ink3);font-size:12px;line-height:1.6}
.hint{color:var(--ink3);font-size:11.5px;line-height:1.65;margin-top:7px}
.row{display:flex;align-items:center;gap:8px}
.row.sb{justify-content:space-between}
.sp{flex:1}
.divider{height:1px;background:var(--line);margin:11px 0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;
  background:#F4EEF3;color:var(--ink2);font-size:12px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.chip.on{background:var(--pink-soft);color:var(--pink2);border-color:var(--pink-line);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapx{flex-wrap:wrap;overflow:visible}
.chips.scrollable{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),rgba(0,0,0,.06));
  mask-image:linear-gradient(90deg,#000 calc(100% - 32px),rgba(0,0,0,.06))}
.chips.scrollable.at-end{-webkit-mask-image:none;mask-image:none}
.swipe-hint{font-size:10.5px;color:var(--ink3);margin:6px 2px 0;display:flex;align-items:center;gap:5px}
.swipe-hint b{color:var(--pink2);font-weight:700}
.swipe-hint.gone{display:none}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:#F1EDF5;color:#6B5A78;
  font-size:11px;margin:0 5px 5px 0;white-space:nowrap}
.tag.mine{background:var(--pink-soft);color:var(--pink2)}
.badge{display:inline-block;padding:1.5px 8px;border-radius:8px;font-size:11px;font-weight:600;color:#fff}
.badge.bili{background:#D67BA8}
.badge.xhs{background:#E0655F}
.badge.other{background:#9C93A3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border-radius:12px;
  background:#F3ECF1;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
.btn.pri{background:var(--pink);color:#fff}
.btn.ghost{background:var(--paper);border:1px solid var(--line2);color:var(--ink2)}
.btn.danger{background:#FDECEC;color:#C0392B}
.btn.wide{width:100%}
.btn:active{opacity:.75}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}
input[type=text],input[type=number],input[type=password],textarea,select{
  width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--paper2);
  color:var(--ink);font-size:13.5px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--pink-line);background:#fff}
textarea{resize:vertical;line-height:1.6}
label.f{display:block;font-size:12px;color:var(--ink3);margin:9px 0 4px}
.sw{position:relative;width:44px;height:25px;border-radius:999px;background:#DDD3DB;transition:.18s;cursor:pointer;flex:0 0 auto}
.sw.on{background:var(--pink)}
.sw i{position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on i{left:21.5px}
.swrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.swrow .lb{flex:1;font-size:13.5px}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--line2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--pink);box-shadow:0 2px 6px rgba(214,51,108,.35)}
.empty{text-align:center;padding:44px 20px;color:var(--ink3)}
.empty .big{font-size:34px;opacity:.5}
.empty p{margin:8px 0 0;font-size:13px}

/* ---------- 搜索 ---------- */
.search{position:relative;margin-bottom:9px}
.search input{padding-left:34px;background:#fff}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:14px}
.search .clr{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:14px;
  padding:3px 6px;cursor:pointer;display:none}
.search.has .clr{display:block}

/* ---------- 时间轴 ---------- */
.dateh{display:flex;align-items:center;gap:9px;margin:18px 0 10px}
.dateh .d{font-size:13.5px;font-weight:700;color:var(--pink2);letter-spacing:.4px}
.dateh .l{flex:1;height:1px;background:linear-gradient(90deg,var(--pink-line),transparent)}
.tl{position:relative;padding-left:16px}
.tl:before{content:'';position:absolute;left:3px;top:6px;bottom:6px;width:1.5px;background:var(--line2);border-radius:2px}
.tl-item{position:relative;margin-bottom:11px}
.tl-item:before{content:'';position:absolute;left:-16.5px;top:19px;width:8px;height:8px;border-radius:50%;
  background:#fff;border:2px solid var(--pink);box-shadow:0 0 0 3px rgba(214,51,108,.09)}
.rec{background:var(--paper);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.rec-h{padding:12px 13px;cursor:pointer}
.rec-t{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3)}
.rec-kw{color:var(--pink2);font-weight:600;font-size:13px}
.rec-peek{font-size:12.5px;color:var(--ink2);margin-top:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec-meta{font-size:11px;color:var(--ink3);margin-top:5px}
.rec-body{padding:0 13px 13px;display:none}
.rec.open .rec-body{display:block}
/* 翻页：换内容，不藏第二页 */
.swipe-wrap{position:relative}
.swipe-hint{text-align:center;font-size:11px;color:#B99;letter-spacing:1px;margin-top:8px;opacity:.8}
/* 日记页：横线格纸 */
.mem .txt.clamped{max-height:84px;overflow:hidden}
.mem .fold{cursor:pointer;color:var(--pink2);font-size:12px;padding:0 2px;user-select:none;margin-left:2px}
.diary-sheet{background:#FFFDF9;border:1px solid #EADFD6;border-radius:10px;padding:10px 12px 14px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,#F0E4E9 25px,#F0E4E9 26px);
  background-position:0 8px;min-height:100%}
.diary-h{font-size:15px;font-weight:700;color:var(--pink2);margin:0 0 3px;line-height:26px}
.diary-m{font-size:11.5px;color:#9A8B92;margin-bottom:4px;line-height:20px}
.diary-tags{margin:2px 0 6px}
.diary-body{font-size:13.5px;line-height:26px;color:#3A3036;white-space:pre-wrap;word-break:break-word;white-space:pre-wrap;word-break:break-word}
.diary-empty{font-size:13px;color:#8A7A82;padding:16px 4px;line-height:26px}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--pink2);margin-bottom:8px}
.cal-nav{cursor:pointer;padding:0 10px;font-size:17px;color:#C48;user-select:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-w{font-size:10.5px;color:#B9A;text-align:center;padding-bottom:2px}
.cal-d{font-size:12.5px;text-align:center;line-height:26px;height:26px;border-radius:8px;color:#C4B8BE}
.cal-d.has{color:#B02A5B;background:#FDEDF3;cursor:pointer}
.cal-d.today{box-shadow:inset 0 0 0 1px #F3C3D6}
.cal-d.on{background:#D6336C;color:#fff}
.cal-d.blank{visibility:hidden}
.rec.open .rec-peek{display:none}
.arrow{transition:.18s;color:var(--ink3);font-size:12px}
.rec.open .arrow{transform:rotate(180deg)}
.item{padding:11px 0;border-top:1px dashed var(--line)}
.item:first-child{border-top:none;padding-top:2px}
.item-t{font-size:13.5px;font-weight:600;line-height:1.5}
.item-m{font-size:11px;color:var(--ink3);margin-top:3px}
.item-s{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.65}
.lnk{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.lnk .bv{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--blue);
  background:#F2F6FD;padding:3px 8px;border-radius:7px;border:1px solid #DFE8F7}
.lnk .mini{font-size:11px;padding:3px 9px;border-radius:8px;background:#F4EEF3;color:var(--ink2);cursor:pointer;font-weight:600}
.lnk .mini:active{background:var(--pink-soft);color:var(--pink2)}
.cmt{font-size:11.5px;color:var(--ink2);background:var(--paper2);border-left:2px solid var(--pink-line);
  padding:6px 9px;border-radius:0 8px 8px 0;margin-top:6px;line-height:1.6}
.note{background:linear-gradient(180deg,#FFF9FB,#FDF4F8);border:1px solid var(--pink-line);
  border-radius:var(--r2);padding:10px 12px;font-size:13px;line-height:1.7;color:#4A3B46;margin-top:9px}
.note .who{font-size:11px;color:var(--pink);font-weight:700;margin-bottom:4px;display:block}

/* ---------- 统计图 ---------- */
.chart{display:flex;justify-content:center;align-items:flex-start;padding:6px 0 2px;min-height:230px;max-height:330px;overflow-y:auto;overflow-x:hidden}
.chart::-webkit-scrollbar{width:5px}
.chart::-webkit-scrollbar-thumb{background:#E7C6D6;border-radius:3px}
.chart::-webkit-scrollbar-track{background:transparent}
.cols{display:flex;align-items:flex-end;gap:6px;height:210px;width:100%;padding:0 4px 4px;overflow-x:auto;overflow-y:hidden}
.cols::-webkit-scrollbar{height:5px}
.cols::-webkit-scrollbar-thumb{background:#E7C6D6;border-radius:3px}
.cols::-webkit-scrollbar-track{background:transparent}
.col{flex:0 0 26px;width:26px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.col-b{width:100%;border-radius:4px 4px 0 0;min-height:5px}
.col-n{font-size:9px;color:#B9A;margin-bottom:3px}
.col-b.seg{cursor:pointer;transition:opacity .15s}
.col-b.seg.dim{opacity:.3}
.col-b.seg.on{box-shadow:0 0 0 2px #fff,0 0 0 3px #D6336C}
.chart-col{align-items:flex-start;max-height:none;overflow:visible;display:block}
.legend{max-height:300px;overflow-y:auto}
.legend::-webkit-scrollbar{width:5px}
.legend::-webkit-scrollbar-thumb{background:#E7C6D6;border-radius:3px}
#notelist{max-height:560px;overflow-y:auto}
#notelist::-webkit-scrollbar{width:5px}
.scrolly{max-height:360px;overflow-y:auto;overflow-x:hidden;padding-right:4px}
.scrolly::-webkit-scrollbar{width:5px}
.scrolly::-webkit-scrollbar-thumb{background:#E7C6D6;border-radius:3px}
.scrolly::-webkit-scrollbar-track{background:transparent}
#notelist::-webkit-scrollbar-thumb{background:#E7C6D6;border-radius:3px}
.chart svg{max-width:100%;height:auto}
.legend{margin-top:10px}
.lg{display:flex;align-items:center;gap:9px;padding:6px 2px;font-size:13px}
.lg .dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.lg .nm{flex:1}
.lg .ct{font-size:12px;color:var(--ink3)}
.lg .own{font-size:10.5px;color:var(--pink);background:var(--pink-soft);padding:1px 7px;border-radius:999px}
.bar-wrap{padding:4px 0}
.bar-row{margin-bottom:9px}
.bar-top{display:flex;font-size:12.5px;margin-bottom:4px}
.bar-track{height:9px;border-radius:5px;background:#F2EBF0;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .5s}
.chart svg .seg{cursor:pointer;touch-action:manipulation;transition:opacity .18s ease,filter .18s ease}
.chart svg .seg.dim{opacity:.28}
.chart svg .seg.on{filter:drop-shadow(0 0 6px rgba(214,51,108,.5))}
.chart svg .seg:active{opacity:.7}
.chart svg .pct{pointer-events:none;font-weight:700}
.bar-wrap .bar-row{cursor:pointer;padding:3px 6px;border-radius:10px;transition:background .15s,opacity .18s}
.bar-wrap .bar-row.dim{opacity:.32}
.bar-wrap .bar-row.on{background:var(--pink-soft)}
.bar-wrap .bv2{font-size:11.5px;color:var(--ink3)}
.bar-wrap .bv2 b{color:var(--pink2)}
.chart-tip{display:none;margin:5px auto 0;text-align:center;font-size:12.5px;color:var(--ink2);
  background:var(--pink-soft);border:1px solid var(--pink-line);border-radius:999px;padding:5px 14px;width:fit-content}
.chart-tip b{color:var(--pink2)}
.chart-hint{text-align:center;font-size:10.5px;color:var(--ink3);margin-top:6px}
.legend .lg{transition:background .15s}
.legend .lg.on{background:var(--pink-soft);border-radius:9px;padding-left:7px;padding-right:7px}

/* ---------- 记忆 ---------- */
.mem{border:1px solid var(--line);border-radius:var(--r2);padding:11px;margin-bottom:9px;background:var(--paper2)}
.mem .mh{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink3)}
.mem .kw{color:var(--pink2);font-weight:600;font-size:12.5px}
.mem .txt{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.65}
.mem .txt.blur{font-style:italic;color:var(--ink3)}
.mem .mt{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:10.5px;color:var(--ink3)}
.imp{flex:1;height:5px;border-radius:3px;background:#EDE5EB;overflow:hidden}
.imp i{display:block;height:100%;background:linear-gradient(90deg,#F6A6C4,#D6336C)}
.state{padding:1px 7px;border-radius:999px;font-size:10px}
.state.fresh{background:#E8F6EE;color:#2E8B57}
.state.compressed{background:#FFF3E0;color:#B26A00}
.state.danger{background:#FDECEC;color:#C0392B}

/* ---------- 存档 ---------- */
.pf{border:1px solid var(--line);border-radius:var(--r2);padding:12px;margin-bottom:9px;background:var(--paper)}
.pf.on{border-color:var(--pink-line);background:linear-gradient(180deg,#FFF9FB,#fff)}
.pf .n{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.pf .n .cur{font-size:10.5px;background:var(--pink);color:#fff;padding:1px 8px;border-radius:999px}
.pf .p{font-size:11.5px;color:var(--ink3);margin-top:5px;word-break:break-all;line-height:1.6}
.editbox{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}
.editbox .row .btn{flex:0 0 auto}

/* ---------- 提示 ---------- */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:rgba(43,36,48,.94);color:#fff;padding:9px 17px;border-radius:999px;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mask{position:fixed;inset:0;background:rgba(43,36,48,.42);display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:100}
.modal{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:380px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.modal h3{margin:0 0 8px;font-size:16px}
.modal p{margin:0 0 14px;font-size:13px;color:var(--ink2);line-height:1.7}
.modal .acts{display:flex;gap:9px}
.modal .acts .btn{flex:1}
.dangerbox{background:#FDECEC;border:1px solid #F5C6C6;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.dangerbox .t{color:#C0392B;font-weight:700;font-size:12.5px}
.dangerbox .d{color:#A94442;font-size:11.5px;margin-top:4px;line-height:1.6}
.loading{text-align:center;padding:80px 20px;color:var(--ink3);font-size:13.5px}

/* ---------- 手记卡片：可折叠 ---------- */
.rec{transition:box-shadow .2s,border-color .2s}
.rec.open{border-color:var(--pink-line);box-shadow:0 2px 6px rgba(90,60,80,.07),0 10px 26px rgba(214,51,108,.10)}
.rec-h:active{background:#FDF7FA}
.rec-sub{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec-body{animation:recin .18s ease}
@keyframes recin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------- 文件列表 ---------- */
.filelist{margin-top:9px;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.frow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-top:1px solid var(--line);background:var(--paper2)}
.frow:first-child{border-top:none}
.frow .fn{flex:1;min-width:0;font-size:12.5px;font-weight:600;word-break:break-all}
.frow .fs{font-size:10.5px;color:var(--ink3);white-space:nowrap}

/* ---------- 可左滑的文件行 ---------- */
.swipe{position:relative;overflow:hidden;border-top:1px solid var(--line);background:var(--paper2)}
.swipe:first-child{border-top:none}
.swipe .slider{position:relative;z-index:1;display:flex;flex-direction:column;align-items:stretch;gap:4px;
  padding:9px 11px;background:var(--paper2);transition:transform .22s ease;touch-action:pan-y}
.swipe .slider .fn{font-size:12.5px;font-weight:600;word-break:break-all}
.swipe .slider .fs{font-size:10.5px;color:var(--ink3)}
.tagx{font-size:10.5px;padding:1px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
.tagx.cur{background:var(--pink);color:#fff}
.tagx.bound{background:#F1EDF5;color:#6B5A78}
.tagx.reg{background:#FDECEC;color:#C0392B}
.swipe .acts{position:absolute;top:0;right:0;height:100%;display:flex;z-index:0}
.swipe .acts .a{width:62px;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;letter-spacing:.5px}
.swipe .acts .a.ren{background:#4C7DC4}
.swipe .acts .a.del{background:#C0392B}
.swipe .acts .a:active{filter:brightness(.9)}
.swipe-hintline{font-size:10.5px;color:var(--ink3);margin-top:7px;line-height:1.6}
.stale{margin:8px 0 0;padding:9px 11px;border-radius:12px;background:#FFF4E5;color:#8A5A00;
  font-size:11.5px;line-height:1.65;border:1px solid #F2DDB6}
.bridge-line{margin:7px 0 0;font-size:10px;color:var(--ink3);letter-spacing:.2px;opacity:.75}
</style>
</head>
<body>
<div id="app"><div class="loading">正在翻开手记…</div></div>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ============ 状态 ============ */
var S = {
  data:null, registry:null, profile:null, dataFile:"", backups:[], cards:[],
  tab:"notes",
  q:"", range:"all", sort:"time_desc", openRec:{}, openPlat:{},
  chart:"ring", chartRange:"all", chartPick:-1,
  newTag:"", blockDraft:"",
  vaultEdit:null, pendingDelete:null,
  baseDir:"", pickOpen:false, pickFiles:null, pickErr:"",
  bridgeVer:"", bridgeShape:""
};

/* 页面自己的版本。桥的版本对不上，就说明这份页面是旧的（缓存没换），
   得明说——不然修了也白修，您看到的还是老那份。 */
var PAGE_VER = '0.4.42';
/* 日记写法默认规则（可被设置页改写） */
var DEFAULT_DIARY_RULE='要有你自己的思考、判断、感想，但让事实垫底——写清看了什么，再说你怎么看。可以是日记、手记、随笔，形式随意、长短随意。唯一要避的是：结尾来一句别人看不懂的升华或中二感慨。实在没什么可说，就别填这一项。';

var PALETTE = ['#D6336C','#E07B39','#E0B33C','#3FA76A','#2E9CA8','#4C7DC4','#8B5FC0','#C2557E','#7A8B99'];
var PERMS = [
  {k:'like',label:'点赞'},{k:'dislike',label:'点踩'},
  {k:'comment',label:'评论'},{k:'delete_comment',label:'删自己的评'},
  {k:'favorite',label:'收藏'},{k:'unfavorite',label:'取消收藏'},
  {k:'dm_reply',label:'私信回复'},{k:'public_reply',label:'公共回复'},
  {k:'follow',label:'关注'},{k:'unfollow',label:'取关'},
  {k:'publish',label:'发帖 / 投稿'}
];
var BLOCKS = [
  {k:'records',label:'手记记录'},{k:'memory',label:'闲逛记忆'},
  {k:'persons',label:'人物卡'},{k:'actions',label:'动作流水'},
  {k:'preferences',label:'偏好标签'},{k:'schedule',label:'定时设置'},
  {k:'platforms',label:'平台与账号'},{k:'wfprompts',label:'工作流指令'}
];

/* ============ 工具 ============ */
function $(id){ return document.getElementById(id); }
/* NodeList.forEach 在某些老 WebView 上没实现——一旦抛错，
   后面的绑定全断，表现就是「输入框怎么改都存不上」。所以自己走循环。 */
function eachEl(sel, fn){
  var list;
  try{ list=document.querySelectorAll(sel); }catch(e){ return; }
  if(!list||!list.length) return;
  for(var i=0;i<list.length;i++) fn(list[i],i);
}
function hasFn(name){
  return (typeof XgHost!=='undefined') && XgHost && (typeof XgHost[name]==='function');
}
/* 版本比对：桥是 0.4.3 起才认「单参 JSON」，老桥只认逗号串 */
function verAtLeast(v, want){
  if(!v) return false;
  var a=String(v).split('.'), b=String(want).split('.');
  for(var i=0;i<3;i++){
    var x=Number(a[i]||0), y=Number(b[i]||0);
    if(x>y) return true;
    if(x<y) return false;
  }
  return true;
}
/* 导出参数：新桥给 JSON（带 tag），老桥只给逗号串——两种桥都吃得下 */
function bkArg(blocks, tag){
  if(verAtLeast(S.bridgeVer,'0.4.3')) return JSON.stringify({blocks:blocks||null,tag:tag||'manual'});
  return blocks&&blocks.length?blocks.join(','):'';
}
var _missed={};
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {'&':'\x26amp;','<':'\x26lt;','>':'\x26gt;','"':'\x26quot;',"'":'\x26#39;'}[c];
  });
}
function splitComments(cs){
  if(cs==null) return [];
  if(typeof cs==='string'){
    return cs.split(/[／|｜]/).map(function(s){return String(s).trim();}).filter(function(s){return !!s;});
  }
  return cs;
}
function escLegacy(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'"',"'":'&#39;'}[c];
  });
}
function pad2(n){ n=Number(n)||0; return (n<10?'0':'')+n; }
function fmtDay(ts){ var d=new Date(ts); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtHM(ts){ var d=new Date(ts); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function fmtStamp(ts){
  if(!ts) return '—';
  var d=new Date(ts);
  return pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function fmtSize(b){
  b=Number(b)||0;
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(2)+' MB';
}
function daysAgoStr(n){
  var d=new Date(); d.setDate(d.getDate()-n);
  return fmtDay(d.getTime());
}

function toast(msg){
  var t=$('toast');
  t.textContent=msg;
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm=setTimeout(function(){ t.classList.remove('on'); },1900);
}

function call(name, args){
  try{
    if(!hasFn(name)){
      if(!_missed[name]){ _missed[name]=1; toast('桥里没有「'+name+'」——插件没重装？'); }
      return null;
    }
    var r;
    var a=args||[];
    /* 单参直接调——Operit 的 WebView 桥对 apply 传参不总是稳，直接调最踏实；
       多参才退回 apply（老写法，留着兼容）。 */
    if(a.length===0) r=XgHost[name]();
    else if(a.length===1) r=XgHost[name](a[0]);
    else r=XgHost[name].apply(XgHost, a);
    if(typeof r==='string'){
      try{ return JSON.parse(r); }catch(e){ return r; }
    }
    return r;
  }catch(e){
    toast('桥调用失败：'+(e&&e.message||e));
    return null;
  }
}

/* ============ 读写 ============ */
function loadAll(){
  var r=call('load');
  if(!r||!r.success){ toast('读不到账本'+(r&&r.error?('：'+r.error):'')); return false; }
  S.registry=r.registry;
  S.profile=r.profile;
  S.dataFile=r.dataFile;
  S.data=r.data;
  S.backups=r.backups||[];
  S.cards=r.cards||[];
  S.baseDir=r.baseDir||S.baseDir||'';
  // 注册表自己不是手记——见到就拔，别让它躺在存档列表里冒充角色卡绑定
  if(sanitizeRegistry()){
    try{ call('saveRegistry',[JSON.stringify(S.registry)]); }catch(e){}
  }
  if(!S.data.memory) S.data.memory={mode:'forget',retention_days:7,blur:.3,compress:true,
    compress_threshold:.45,forget_threshold:.15,memories:[],stats:{}};
  if(!S.data.memory.memories) S.data.memory.memories=[];
  return true;
}
function save(){
  if(!S.data) return;
  var r=call('save',[JSON.stringify(S.data)]);
  if(r && r.success===false) toast('存不上：'+(r.error||''));
}

/* ============ 手记：筛选 ============ */
function tagCounts(){ return (S.data&&S.data.stats&&S.data.stats.tagCounts)||{}; }

function allRecords(){
  var recs=(S.data&&S.data.records)||[];
  return recs.slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
}

function inRange(r){
  if(S.range==='all') return true;
  var days = S.range==='3'?3:(S.range==='7'?7:30);
  var cut = new Date(); cut.setDate(cut.getDate()-(days-1)); cut.setHours(0,0,0,0);
  return (r.ts||0) >= cut.getTime();
}

function matchQ(r){
  if(!S.q) return true;
  var q=S.q.toLowerCase();
  var hay=[r.keyword||'',r.platform||'',r.note||'',(r.tags||[]).join(' ')];
  var items=r.items||[];
  for(var i=0;i<items.length;i++){
    var it=items[i]||{};
    hay.push(it.title||'',it.author||'',it.summary||'');
    var cs=splitComments(it.comments);
    for(var c=0;c<cs.length;c++) hay.push(cs[c]);
  }
  return hay.join(' ').toLowerCase().indexOf(q)>=0;
}

function visibleRecords(){
  var recs=allRecords().filter(function(r){ return inRange(r)&&matchQ(r)&&(!S.dateFilter||r.date===S.dateFilter); });
  if(S.sort==='time_asc') recs.reverse();
  else if(S.sort==='tag'){
    // 同标签的聚到顶部：按「本条标签在全部记录里的总热度」排
    var tc=tagCounts();
    function heat(r){
      var t=r.tags||[], m=0;
      for(var i=0;i<t.length;i++) m=Math.max(m,Number(tc[t[i]])||0);
      return m;
    }
    recs.sort(function(a,b){
      var ha=heat(a),hb=heat(b);
      if(ha!==hb) return hb-ha;
      return (b.ts||0)-(a.ts||0);
    });
  }
  return recs;
}

/* ============ 平台徽章 ============ */
function platClass(name){
  var n=String(name||'');
  if(n.indexOf('B')>=0||n.toLowerCase().indexOf('bili')>=0) return 'bili';
  if(n.indexOf('小红书')>=0||n.toLowerCase().indexOf('xhs')>=0) return 'xhs';
  return 'other';
}
function platBadge(name){
  return '<span class="badge '+platClass(name)+'">'+esc(name||'未知')+'</span>';
}
function tagChip(t,mine){
  return '<span class="tag'+(mine?' mine':'')+'">#'+esc(t)+'</span>';
}

/* ============ 链接 ============ */
function bvOf(url){
  var m=String(url||'').match(/(BV[0-9A-Za-z]+)/);
  if(m) return m[1];
  var m2=String(url||'').match(/explore\/([0-9a-f]{16,})/i);
  if(m2) return m2[1].slice(0,14)+'…';
  try{ var u=new URL(url); return u.hostname; }catch(e){ return String(url||'').slice(0,18); }
}
function linkRow(url){
  if(!url) return '';
  var bv=bvOf(url);
  return '<div class="lnk">'
    +'<span class="bv">'+esc(bv)+'</span>'
    +'<span class="mini" data-act="open" data-url="'+esc(url)+'">打开</span>'
    +'<span class="mini" data-act="copy" data-txt="'+esc(url)+'">复制链接</span>'
    +'<span class="mini" data-act="copy" data-txt="'+esc(bv)+'">复制'+esc(/^BV/.test(bv)?'BV号':'号')+'</span>'
    +'</div>';
}

/* ============ 手记页 ============ */
function recCard(r){
  var open=!!S.openRec[r.id];
  var items=r.items||[];
  var peek='',peekSub='';
  if(items.length){
    var it0=items[0]||{};
    peek=esc(it0.title||'');
    if(it0.summary) peekSub=esc(it0.summary);
  }
  var meta='';
  if(items.length&&items[0]&&items[0].stats) meta=esc(items[0].stats);
  if(items.length>1) meta+=(meta?' · ':'')+'还有 '+(items.length-1)+' 条';
  var tags=(r.tags||[]).map(function(t){ return tagChip(t); }).join('');
  var h='<div class="tl-item"><div class="rec'+(open?' open':'')+'">';
  h+='<div class="swipe-wrap" data-swipe="'+esc(r.id)+'">';
  h+='<div class="rec-h" data-act="toggle-rec" data-k="'+esc(r.id)+'">';
  h+='<div class="rec-t">'+esc(r.time||'')+' '+platBadge(r.platform)
     +'<span class="sp"></span><span class="arrow">▾</span></div>';
  h+='<div style="margin-top:5px"><span class="rec-kw">「'+esc(r.keyword||'随手逛')+'」</span></div>';
  if(peek) h+='<div class="rec-peek">'+peek+'</div>';
  if(peekSub) h+='<div class="rec-sub">'+peekSub+'</div>';
  if(meta) h+='<div class="rec-meta">'+meta+'</div>';
  if(tags) h+='<div style="margin-top:6px">'+tags+'</div>';
  h+='</div>';
  h+='<div class="rec-body">';
  for(var i=0;i<items.length;i++){
    var it=items[i]||{};
    h+='<div class="item">';
    h+='<div class="item-t">'+(i+1)+'. '+esc(it.title||'（无题）')+'</div>';
    var m=[];
    if(it.author) m.push('作者 '+esc(it.author));
    if(it.stats) m.push(esc(it.stats));
    if(m.length) h+='<div class="item-m">'+m.join(' · ')+'</div>';
    h+=linkRow(it.url);
    if(it.summary) h+='<div class="item-s">'+esc(it.summary)+'</div>';
    var cs=splitComments(it.comments);
    for(var c=0;c<cs.length;c++) h+='<div class="cmt">「'+esc(cs[c])+'」</div>';
    h+='</div>';
  }
  if(tags) h+='<div style="margin-top:10px">'+tags+'</div>';
  h+='</div>';
  h+='</div>';
  h+='<div class="swipe-hint" data-act="flip" data-k="'+esc(r.id)+'">← 左滑看日记 · 右滑回手记 →</div>';
  h+='</div></div>';
  return h;
}
/* 日记页内容（翻页时直接换进来） */
function diaryHTML(r){
  var dg=r&&r.diary;
  if(!dg) return '<div class="diary-sheet"><div class="diary-empty">这趟没写日记。<br/>没什么可说就不说——空着也是真的。</div></div>';
  return '<div class="diary-sheet">'
    +'<div class="diary-h">'+esc(dg.title||'（无题）')+'</div>'
    +'<div class="diary-m">'+esc(r.date||'')+' '+esc(r.time||'')+platBadge(r.platform)+'</div>'
    +'<div class="diary-tags">'+((dg.tags&&dg.tags.length?dg.tags:(r.tags||[]))).map(function(t){return tagChip(t);}).join('')+'</div>'
    +'<div class="diary-body">'+esc(dg.content||'')+'</div>'
    +'</div>';
}
function findRec(id){
  var all=allRecords();
  for(var i=0;i<all.length;i++){ if(all[i].id===id) return all[i]; }
  return null;
}
/* 翻页 = 换内容，不藏第二页 */
function flipCard(w,on){
  try{
    if(!w._noteHTML) w._noteHTML=w.innerHTML;
    if(on){ w.innerHTML=diaryHTML(findRec(w.getAttribute('data-swipe'))); }
    else { w.innerHTML=w._noteHTML; }
    w.classList.toggle('on-diary',!!on);
  }catch(e){}
}

function calendarHTML(){
  var now=new Date();
  var y=S.calY||now.getFullYear();
  var mo=(S.calM===undefined||S.calM===null)?now.getMonth():S.calM;
  var startDay=new Date(y,mo,1).getDay();
  var days=new Date(y,mo+1,0).getDate();
  var has={};
  var all=allRecords();
  for(var i=0;i<all.length;i++){ if(all[i].date) has[all[i].date]=1; }
  var h='<div class="cal-h"><span class="cal-nav" data-act="cal-prev">‹</span>'
   +'<b>'+y+' 年 '+(mo+1)+' 月</b><span class="cal-nav" data-act="cal-next">›</span></div>';
  h+='<div class="cal-grid">';
  var wd=['日','一','二','三','四','五','六'];
  for(var w=0;w<7;w++) h+='<span class="cal-w">'+wd[w]+'</span>';
  for(var b=0;b<startDay;b++) h+='<span class="cal-d blank"></span>';
  var today=fmtDay(Date.now());
  for(var d=1;d<=days;d++){
    var ds=y+'-'+pad2(mo+1)+'-'+pad2(d);
    var cls='cal-d'+(has[ds]?' has':'')+(ds===today?' today':'')+(S.dateFilter===ds?' on':'');
    h+='<span class="'+cls+'"'+(has[ds]?(' data-act="cal-pick" data-v="'+ds+'"'):'')+'>'+d+'</span>';
  }
  h+='</div>';
  if(S.dateFilter) h+='<div class="muted" style="margin-top:7px">只看 '+esc(S.dateFilter)+' 的手记 ·<span data-act="cal-clear" style="color:var(--pink2);cursor:pointer"> 取消</span></div>';
  return h;
}

function notesMain(){
  var recs=visibleRecords();
  var all=allRecords();
  var today=fmtDay(Date.now());
  var todayN=0,lastTs=0;
  for(var i=0;i<all.length;i++){
    if(all[i].date===today) todayN++;
    if((all[i].ts||0)>lastTs) lastTs=all[i].ts||0;
  }
  var sch=S.data.schedule||{};
  var mem=S.data.memory||{};
  var h='';

  // 概览
  h+='<div class="card tight">';
  h+='<div class="row sb"><div style="font-size:13.5px;font-weight:700">今天 '+todayN+' 笔 · 共 '+all.length+' 笔</div>'
    +'<div class="muted">上次 '+fmtStamp(lastTs)+'</div></div>';
  h+='<div class="muted" style="margin-top:4px">下一次醒来：'
    +(sch.enabled?('每 '+sch.interval_hours+' 小时，'+sch.active_start+'–'+sch.active_end+' 点之间'):'定时已关，只能手动')
    +' · 记忆库 '+((mem.memories||[]).length)+' 条</div>';
  h+='<div class="card tight" id="calbox">'+calendarHTML()+'</div>';
  h+='<div style="margin-top:10px"><button class="btn pri wide" data-act="urge">'
    +(S.data.manual_request?'已经排上队了 ✓':'催我出门逛一趟')+'</button></div>';
  h+='</div>';

  // 工具条
  h+='<div class="search'+(S.q?' has':'')+'" id="searchbox">'
    +'<span class="mag">🔍</span>'
    +'<input type="text" id="q" placeholder="搜 AI 逛过什么——标题、梗概、标签、评论都能搜" value="'+esc(S.q)+'" />'
    +'<span class="clr" data-act="clear-q">✕</span></div>';

  h+='<div class="chips" id="notebar" style="margin-bottom:7px">'+chipsHTML()+'</div>';

  h+='<div class="muted" id="filterhint" style="margin-bottom:4px">'+filterHint()+'</div>';

  // 列表
  h+='<div id="notelist">'+notesList()+'</div>';
  return h;
}

function chipsHTML(){
  var h='';
  [['all','全部'],['3','近 3 天'],['7','近 7 天'],['30','近 30 天']].forEach(function(p){
    h+='<span class="chip'+(S.range===p[0]?' on':'')+'" data-act="range" data-v="'+p[0]+'">'+p[1]+'</span>';
  });
  h+='<span style="width:8px;flex:0 0 auto"></span>';
  [['time_desc','新→旧'],['time_asc','旧→新'],['tag','按标签聚']].forEach(function(p){
    h+='<span class="chip'+(S.sort===p[0]?' on':'')+'" data-act="sort" data-v="'+p[0]+'">'+p[1]+'</span>';
  });
  return h;
}

function notesList(){
  var all=visibleRecords();
  var recs = S.showAll ? all : all.slice(0, S.limitN||3);
  var h='';
  if(!recs.length){
    h+='<div class="empty"><div class="big">🗒</div><p>'
      +(all.length? '这个条件下没翻到东西，换个词试试' : '还没出门逛过，下一次唤醒后会自动出门')
      +'</p></div>';
    return h;
  }
  var lastDate='';
  for(var j=0;j<recs.length;j++){
    var r=recs[j];
    if(r.date!==lastDate){
      if(lastDate) h+='</div>';
      h+='<div class="dateh"><span class="d">'+esc(r.date||'')+'</span><span class="l"></span></div><div class="tl">';
      lastDate=r.date;
    }
    h+=recCard(r);
  }
  h+='</div>';
  if(!S.showAll && all.length>recs.length){
    h+='<div style="margin-top:12px"><button class="btn ghost wide" data-act="show-all">还有 '+(all.length-recs.length)+' 条 · 看全部</button></div>';
  } else if(S.showAll && all.length>3){
    h+='<div style="margin-top:12px"><button class="btn ghost wide" data-act="show-less">收起，只看最近 3 条</button></div>';
  }
  return h;
}
function filterHint(){
  var n=visibleRecords().length;
  return (S.q?('搜「'+esc(S.q)+'」，'):'')
    +'筛出 '+n+' 笔'+(S.range!=='all'?('（近 '+S.range+' 天）'):'')
    +(S.sort==='tag'?'，同标签的排在上面':'');
}

/* ============ 设置页 ============ */
function swRow(label,checked,act,key){
  return '<div class="swrow"><span class="lb">'+esc(label)+'</span>'
    +'<span class="sw'+(checked?' on':'')+'" data-act="'+act+'" data-k="'+esc(key||'')+'"><i></i></span></div>';
}

/* ============ 工作流页（改提示词） ============ */
function wfMain(){
  var h='';
  h+='<div class="card">';
  h+='<div class="sec-h" style="margin:0 0 6px"><span class="bar"></span>工作流提示词</div>';
  h+='<div class="hint" style="margin-top:0">这里改的是「闲逛手记」工作流里的指令段，AI 出门前按它执行。改完点「保存这段」，下一趟生效。</div>';
  h+='<div style="margin:10px 0"><button class="btn sm pri" data-act="wf-reload">重新读取</button><span class="muted" style="margin-left:10px">刚进来先点它一下</span></div>';
  var ps=S.wfPrompts;
  if(!ps||!ps.length){
    h+='<div class="muted" style="margin-top:8px">还没读到。</div>';
  }else{

function statsTags(){
  var counts=tagCounts();
  var blocked=(S.data.preferences&&S.data.preferences.blocked_tags)||[];
  var userTags=(S.data.preferences&&S.data.preferences.user_tags)||[];
  var map={};
  var recs=allRecords();
  var cutTs=0;
  if(S.chartRange!=='all'){
    var days=S.chartRange==='7'?7:30;
    var d=new Date(); d.setDate(d.getDate()-(days-1)); d.setHours(0,0,0,0);
    cutTs=d.getTime();
  }
  // 按时间窗重算，而不是用总计数
  for(var i=0;i<recs.length;i++){
    var r=recs[i];
    if(cutTs && (r.ts||0)<cutTs) continue;
    var ts=r.tags||[];
    for(var j=0;j<ts.length;j++){
      var t=ts[j];
      if(blocked.indexOf(t)>=0) continue;
      map[t]=(map[t]||0)+1;
    }
  }
  for(var u=0;u<userTags.length;u++){
    var ut=userTags[u]&&userTags[u].tag;
    if(!ut) continue;
    if(blocked.indexOf(ut)>=0) continue;
    if(map[ut]===undefined) map[ut]=0;
  }
  var arr=[];
  for(var k in map){ if(Object.prototype.hasOwnProperty.call(map,k)) arr.push({tag:k,count:map[k],mine:userTags.some(function(x){return x&&x.tag===k;})}); }
  arr.sort(function(a,b){ return b.count-a.count; });
  return arr;
}

function svgRing(tags){
  if(!tags.length) return '<div class="empty"><div class="big">◎</div><p>还没逛出偏好来</p></div>';
  var W=300,H=250,cx=W/2,cy=H/2;
  var top=tags.slice(0,6);
  var total=0;
  for(var q=0;q<top.length;q++) total+=Math.max(0,Number(top[q].count)||0);
  if(total<=0) total=1;
  var R0=116, Rin=20, avail=R0-Rin;
  // 环带厚度按占比算：最薄 11 保证看得见，单块最厚 0.56 留出中心
  var ths=[],sum=0;
  for(var i=0;i<top.length;i++){
    var th=Math.max(11, Math.min(avail*0.56, avail*(Math.max(0,Number(top[i].count)||0)/total)));
    ths.push(th); sum+=th;
  }
  if(sum>avail){ var kk=avail/sum; for(var z=0;z<ths.length;z++) ths[z]*=kk; }
  var h='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  var cur=R0, picks=[];
  for(var j=0;j<top.length;j++){
    var t=top[j];
    var col=PALETTE[j%PALETTE.length];
    var ro=cur, ri=Math.max(0,cur-ths[j]);
    var rm=(ro+ri)/2, sw=ro-ri;
    var pct=Math.round((Math.max(0,Number(t.count)||0)/total)*100);
    picks[j]={tag:t.tag,count:t.count,pct:pct};
    var on=(S.chartPick===j);
    h+='<circle class="seg'+(on?' on':'')+'" data-act="chartpick" data-v="'+j+'" cx="'+cx+'" cy="'+cy+'" r="'+rm.toFixed(1)+'"'
      +' fill="none" stroke="'+col+'" stroke-width="'+sw.toFixed(1)+'" opacity="'+(on?1:0.94)+'" />';
    if(sw>=10){
      h+='<text class="pct" x="'+cx+'" y="'+(cy-rm+3.4).toFixed(1)+'" text-anchor="middle" font-size="9.5" fill="#fff">'+pct+'%</text>';
    }
    cur=ri;
  }
  if(cur>=36){
    h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(cur-3).toFixed(1)+'" fill="#FCF6F9" />';
    h+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2B2430">'+esc(top[0].tag)+'</text>';
    h+='<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" font-size="9.5" fill="#A198A8">'+top[0].count+' 条 · 占 '+Math.round((Math.max(0,Number(top[0].count)||0)/total)*100)+'%</text>';
  }
  h+='</svg>';
  window._chartData=picks;
  return h;
}

function arcPath(cx,cy,ro,ri,a0,a1){
  function pt(a,r){ return [(cx+r*Math.cos(a)).toFixed(2),(cy+r*Math.sin(a)).toFixed(2)]; }
  var large=(a1-a0)>Math.PI?1:0;
  var p0=pt(a0,ro),p1=pt(a1,ro),p2=pt(a1,ri),p3=pt(a0,ri);
  if(ri<=0.5){
    return 'M'+cx+','+cy+' L'+p0[0]+','+p0[1]+' A'+ro+','+ro+' 0 '+large+' 1 '+p1[0]+','+p1[1]+' Z';
  }
  return 'M'+p0[0]+','+p0[1]+' A'+ro+','+ro+' 0 '+large+' 1 '+p1[0]+','+p1[1]
    +' L'+p2[0]+','+p2[1]+' A'+ri+','+ri+' 0 '+large+' 0 '+p3[0]+','+p3[1]+' Z';
}

function svgPie(tags,donut){
  if(!tags.length) return '<div class="empty"><div class="big">◎</div><p>还没逛出偏好来</p></div>';
  var W=320,H=254,cx=W/2,cy=H/2-2,ro=86,ri=donut?46:0;
  var total=tags.reduce(function(a,b){ return a+Math.max(0,Number(b.count)||0); },0);
  var h='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  var picks=[];
  if(total<=0){
    h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+ro+'" fill="#F2EBF0" />';
    h+='<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="12" fill="#A198A8">只有偏好标签，还没有记录</text>';
  }else{
    var a=-Math.PI/2;
    for(var i=0;i<tags.length;i++){
      var t=tags[i];
      var share=(Math.max(0,Number(t.count)||0))/total;
      var span=Math.PI*2*share;
      if(span<=0) continue;
      var pct=Math.round(share*100);
      picks[i]={tag:t.tag,count:t.count,pct:pct};
      var on=(S.chartPick===i);
      h+='<path class="seg'+(on?' on':'')+'" data-act="chartpick" data-v="'+i+'" d="'+arcPath(cx,cy,ro,ri,a,a+span)+'"'
        +' fill="'+PALETTE[i%PALETTE.length]+'" stroke="#fff" stroke-width="1.6" opacity="'+(on?1:0.94)+'" />';
      var mid=a+span/2;
      if(share>=0.075){
        // 够大的扇形，数字直接压在块上
        var lr=donut?((ro+ri)/2):(ro*0.66);
        var lx=cx+lr*Math.cos(mid), ly=cy+lr*Math.sin(mid);
        h+='<text class="pct" x="'+lx.toFixed(1)+'" y="'+(ly+3.6).toFixed(1)+'" text-anchor="middle" font-size="10.5" fill="#fff">'+pct+'%</text>';
      }else{
        // 太窄，数字挪到圈外，带引线
        var orr=ro+13;
        var ox=cx+orr*Math.cos(mid), oy=cy+orr*Math.sin(mid);
        var anch=(Math.cos(mid)>=0)?'start':'end';
        ox+=(anch==='start'?2:-2);
        h+='<text class="pct" x="'+ox.toFixed(1)+'" y="'+(oy+3.4).toFixed(1)+'" text-anchor="'+anch+'" font-size="9.5" fill="'+PALETTE[i%PALETTE.length]+'">'+pct+'%</text>';
      }
      a+=span;
    }
  }
  if(donut){
    h+='<text x="'+cx+'" y="'+(cy-1)+'" text-anchor="middle" font-size="20" font-weight="700" fill="#2B2430">'+total+'</text>';
    h+='<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="10" fill="#A198A8">次浏览</text>';
  }
  h+='</svg>';
  window._chartData=picks;
  return h;
}

function svgBar(tags){
  if(!tags.length) return '<div class="empty"><div class="big">◎</div><p>还没逛出偏好来</p></div>';
  var max=Math.max.apply(null,tags.map(function(t){return Math.max(0,Number(t.count)||0);}));
  if(max<=0) max=1;
  var total=tags.reduce(function(a,b){ return a+Math.max(0,Number(b.count)||0); },0);
  if(total<=0) total=1;
  var picks=[];
  var h='<div class="bar-wrap" style="width:100%">';
  for(var i=0;i<tags.length;i++){
    var t=tags[i];
    var c=Math.max(0,Number(t.count)||0);
    var pct=Math.max(4,Math.round(c/max*100));
    var share=Math.round(c/total*100);
    picks[i]={tag:t.tag,count:t.count,pct:share};
    var col=PALETTE[i%PALETTE.length];
    var on=(S.chartPick===i);
    h+='<div class="bar-row'+(on?' on':'')+'" data-act="chartpick" data-v="'+i+'">'
      +'<div class="bar-top"><span class="sp">'+esc(t.tag)+'</span>'
      +'<span class="bv2"><b>'+t.count+'</b> 条 · '+share+'%</span></div>'
      +'<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div></div>';
  }
  window._chartData=picks;
  return h+'</div>';
}

function svgTrend(){
  var recs=allRecords();
  if(!recs.length) return '<div class="empty"><div class="big">◎</div><p>还没有记录，画不出曲线</p></div>';
  // 最近 14 天
  var days=14,pts=[];
  for(var i=days-1;i>=0;i--){
    var key=daysAgoStr(i);
    var n=0,m=0;
    for(var j=0;j<recs.length;j++){
      if(recs[j].date===key){ n++; m+=(recs[j].items||[]).length; }
    }
    pts.push({d:key,n:n,m:m});
  }
  var W=320,H=200,pad=28;
  var max=Math.max(1,Math.max.apply(null,pts.map(function(p){return p.m;})));
  var iw=W-pad*2, ih=H-pad*2;
  function X(i){ return pad + (pts.length<=1?iw/2:iw*i/(pts.length-1)); }
  function Y(v){ return pad + ih - ih*(v/max); }
  var line='',area='';
  for(var k=0;k<pts.length;k++){
    line+=(k?' L':'M')+X(k).toFixed(1)+','+Y(pts[k].m).toFixed(1);
  }
  area=line+' L'+X(pts.length-1).toFixed(1)+','+(pad+ih)+' L'+X(0).toFixed(1)+','+(pad+ih)+' Z';
  var h='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  h+='<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="#D6336C" stop-opacity="0.28"/>'
    +'<stop offset="100%" stop-color="#D6336C" stop-opacity="0.02"/></linearGradient></defs>';
  // 网格
  for(var g=0;g<=2;g++){
    var y=pad+ih*g/2;
    h+='<line x1="'+pad+'" y1="'+y+'" x2="'+(pad+iw)+'" y2="'+y+'" stroke="#EFE6EC" stroke-width="1"/>';
  }
  h+='<path d="'+area+'" fill="url(#g1)"/>';
  h+='<path d="'+line+'" fill="none" stroke="#D6336C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  var picks=[];
  var nz=0;
  for(var c0=0;c0<pts.length;c0++){ if(pts[c0].m>0) nz++; }
  for(var p=0;p<pts.length;p++){
    picks[p]={tag:pts[p].d,count:pts[p].m,pct:null,sub:pts[p].n+' 笔 · '+pts[p].m+' 条',
      x:X(p).toFixed(1),y:Y(pts[p].m).toFixed(1)};
    if(pts[p].m>0){
      h+='<circle cx="'+X(p).toFixed(1)+'" cy="'+Y(pts[p].m).toFixed(1)+'" r="3" fill="#fff" stroke="#D6336C" stroke-width="2"/>';
      if(nz<=8){
        h+='<text class="pct" x="'+X(p).toFixed(1)+'" y="'+(Y(pts[p].m)-7).toFixed(1)+'" text-anchor="middle" font-size="9" fill="#B32A59">'+pts[p].m+'</text>';
      }
    }
  }
  h+='<line id="tmark-line" x1="0" y1="'+pad+'" x2="0" y2="'+(pad+ih)+'" stroke="#D6336C" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
  h+='<circle id="tmark-dot" cx="0" cy="0" r="5" fill="#D6336C" stroke="#fff" stroke-width="2" opacity="0"/>';
  for(var q2=0;q2<pts.length;q2++){
    h+='<circle class="seg hit" data-act="chartpick" data-v="'+q2+'" cx="'+X(q2).toFixed(1)+'" cy="'+Y(pts[q2].m).toFixed(1)+'" r="9" fill="transparent"/>';
  }
  h+='<text x="'+pad+'" y="'+(H-8)+'" font-size="9" fill="#A198A8">'+esc(pts[0].d.slice(5))+'</text>';
  h+='<text x="'+(W-pad)+'" y="'+(H-8)+'" font-size="9" fill="#A198A8" text-anchor="end">'+esc(pts[pts.length-1].d.slice(5))+'</text>';
  h+='<text x="'+pad+'" y="'+(pad-9)+'" font-size="9" fill="#A198A8">最多 '+max+' 条/天</text>';
  h+='</svg>';
  window._chartData=picks;
  return h;
}

function svgColumn(tags){
  var list=tags.slice(0);
  if(!list.length) return '<div class="muted">还没有数据。</div>';
  var mx=1;
  for(var i=0;i<list.length;i++) mx=Math.max(mx,Number(list[i].count)||0);
  var h='<div style="width:100%"><div class="cols">';
  for(var j=0;j<list.length;j++){
    var t=list[j], hp=Math.round((Number(t.count)||0)/mx*100);
    h+='<div class="col"><div class="col-n">'+(Number(t.count)||0)+'</div>'
      +'<div class="col-b seg" data-act="chartpick" data-v="'+j+'" style="height:'+Math.max(5,hp)+'%;background:'+PALETTE[j%PALETTE.length]+'" title="'+esc(t.tag)+'"></div></div>';
  }
  h+='</div><div class="muted" style="text-align:center;margin-top:6px">左右滑，能看全部标签</div></div>';
  return h;
}
function statsMain(){

  var h='';

  [['ring','柱状'],['donut','环形'],['pie','扇形'],['bar','条形'],['trend','趋势']].forEach(function(c){
    h+='<span class="chip'+(S.chart===c[0]?' on':'')+'" data-act="chart" data-v="'+c[0]+'">'+c[1]+'</span>';
  });
  h+='</div>';

  if(S.chart!=='trend'){
    h+='<div class="chips wrapx" style="margin-top:7px;margin-bottom:9px">';

  h+='</div>';

  h+='<div class="hint">'
    +(S.chart==='ring'?'排行：竖条越高 = 看得越多。'
      :S.chart==='trend'?'趋势：最近 14 天，每天看了几条。'
      :'按占比切分，色块越大 = 看得越多。')
    +'</div>';

      ?'点一下折线上的点，看那天看了多少'
      :'点一下色块，它会亮起来，其余变淡')+'</div>';

  if(S.chart!=='trend'&&tags.length){
    var lgTotal=0;
    for(var q3=0;q3<tags.length;q3++) lgTotal+=Math.max(0,Number(tags[q3].count)||0);
    if(lgTotal<=0) lgTotal=1;
    h+='<div class="divider"></div><div class="legend">';
    var lgShow=S.tagAll?tags.length:Math.min(tags.length,8);
    for(var i=0;i<lgShow;i++){
      var t=tags[i];
      var lpct=Math.round((Math.max(0,Number(t.count)||0)/lgTotal)*100);
      h+='<div class="lg'+(S.chartPick===i?' on':'')+'" data-i="'+i+'"><span class="dot" style="background:'+PALETTE[i%PALETTE.length]+'"></span>'
        +'<span class="nm">'+esc(t.tag)+'</span>'
        +(t.mine?'<span class="own">已添加</span>':'')
        +'<span class="ct">'+t.count+' 条 · '+lpct+'%</span></div>';
    }
    h+='</div>';
  }
  h+='</div>';

  if(tags.length>8){
    h+='<div style="margin-top:10px"><button class="btn ghost wide" data-act="tag-all">'
      +(S.tagAll?'收起，只看前 8 个':('还有 '+(tags.length-8)+' 个标签 · 看全部'))+'</button></div>';
  }
  return h;
}

function starChart(ppl){

    h+='<rect x="0" y="0" width="'+W+'" height="'+H+'" rx="10" fill="url(#xgSky)"/>';

/* ============ 存档页 ============ */
function baseDirOf(){
  var b=S.baseDir||'/storage/emulated/0/Download/Operit/闲逛手记/';
  if(b.charAt(b.length-1)!=='/') b+='/';
  return b;
}
function fullOf(p){
  if(!p) return '';
  var f=String(p.data_file||'data.json');
  if(f.charAt(0)==='/') return f;
  return baseDirOf()+f;
}
function shortOf(path){
  var b=baseDirOf();
  var s=String(path||'');
  return s.indexOf(b)===0?s.slice(b.length):s;
}
/* 注册表不是手记——指着 profiles.json 的本子都是坏账，见到就拔。
   三种漏网全堵上：手滑写成 datafile、名字就叫 profiles、路径写成绝对。 */
function isRegFile(p){
  if(!p) return false;
  var raw=(p.data_file!==undefined&&p.data_file!==null&&String(p.data_file)!=='')
    ? p.data_file
    : (p.datafile!==undefined?p.datafile:(p.dataFile!==undefined?p.dataFile:''));
  var s=String(raw||'').trim();
  var full=s.charAt(0)==='/'?s:(baseDirOf()+s);
  if(full===baseDirOf()+'profiles.json') return true;
  var n=String(p.name||'').trim().toLowerCase();
  if(n==='profiles'||n==='profiles.json') return true;
  return false;
}
function sanitizeRegistry(){
  var reg=S.registry;
  if(!reg||!reg.profiles||!reg.profiles.length) return false;
  var keep=[],drop=0;
  for(var i=0;i<reg.profiles.length;i++){
    if(isRegFile(reg.profiles[i])){ drop++; continue; }
    keep.push(reg.profiles[i]);
  }
  if(!drop) return false;
  if(!keep.length){
    keep=[{id:'default',name:'默认手记',card_id:'',card_name:'',persona:'',
      data_file:'data.json',created_at:Date.now(),note:''}];
  }
  reg.profiles=keep;
  var okAct=false;
  for(var j=0;j<keep.length;j++){ if(keep[j].id===reg.active){ okAct=true; break; } }
  if(!okAct) reg.active=keep[0].id;
  return true;
}

  var onPlats=(S.data.platforms||[]).filter(function(p){return p.account&&p.account.online;});
  var onlineTxt=onPlats.length?('在线：'+onPlats.map(function(p){return p.name;}).join('、')):'未登录 · 以路人身份逛';
  var recN=(S.data.records||[]).length;

  var h='';

    +'<div class="iconbtn" data-act="reload">⟳</div></div>';

    +esc(onlineTxt)+' · 共 '+recN+' 笔'
    +'</div>';

  /* 页面版本跟桥对不上 = 您眼前这份是旧缓存。直说，别让您对着老界面找毛病。 */
  if(S.bridgeVer && PAGE_VER && S.bridgeVer!==PAGE_VER){
    h+='<div class="stale">⚠ 当前这份页面是旧的（页 '+esc(PAGE_VER)+' / 桥 '+esc(S.bridgeVer)
      +'）。把侧栏整个关掉、再重开一次；不行就重启 Operit。只点右上那个刷新键不够。</div>';
  }

  /* 一行小字：桥版本 + 桥递参数的形态。出问题时这一行就是证据。 */
  h+='<div class="bridge-line">桥 '+esc(S.bridgeVer||'?')+' · 页 '+esc(PAGE_VER)
    +(S.bridgeShape?(' · 参数 '+esc(S.bridgeShape)):'')+'</div>';

  h+='<div class="tabs">';
  [['notes','手记'],['trail','足迹'],['stats','统计'],['memory','记忆'],['settings','设置'],['vault','存档'],['wf','工作流']].forEach(function(t){
    h+='<span class="tab'+(S.tab===t[0]?' on':'')+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</span>';
  });
  h+='</div>';

  h+='<div class="wrap">';
  if(S.tab==='settings') h+=settingsMain();
  else if(S.tab==='trail') h+=trailMain();
  else if(S.tab==='stats') h+=statsMain();
  else if(S.tab==='memory') h+=memoryMain();
  else if(S.tab==='vault') h+=vaultMain();
  else if(S.tab==='wf') h+=wfMain();
  else h+=notesMain();
  h+='</div>';

  app.innerHTML=h;
  bindInputs();
  bindSwipes();
  applyChartPick();
  markScrollables();
}

/* ============ 图表点选（只动 DOM，不整页重绘，滚动条不跳） ============ */
function applyChartPick(){
  var pick=(typeof S.chartPick==='number')?S.chartPick:-1;
  var segs=document.querySelectorAll('.chart .seg');
  for(var i=0;i<segs.length;i++){
    var idx=Number(segs[i].getAttribute('data-v'));
    var on=(idx===pick);
    segs[i].classList.toggle('on',on);
    segs[i].classList.toggle('dim',pick>=0&&!on);
  }
  var rows=document.querySelectorAll('.bar-wrap .bar-row');
  for(var j=0;j<rows.length;j++){
    var jdx=Number(rows[j].getAttribute('data-v'));
    var jon=(jdx===pick);
    rows[j].classList.toggle('on',jon);
    rows[j].classList.toggle('dim',pick>=0&&!jon);
  }
  var lgs=document.querySelectorAll('.legend .lg');
  for(var m=0;m<lgs.length;m++){
    lgs[m].classList.toggle('on',Number(lgs[m].getAttribute('data-i'))===pick);
  }
  var tl=$('tmark-line'), td=$('tmark-dot');
  if(tl&&td){
    var d0=window._chartData&&window._chartData[pick];
    if(pick>=0&&d0&&d0.x!==undefined){
      tl.setAttribute('x1',d0.x); tl.setAttribute('x2',d0.x); tl.setAttribute('opacity','0.7');
      td.setAttribute('cx',d0.x); td.setAttribute('cy',d0.y); td.setAttribute('opacity','1');
    }else{
      tl.setAttribute('opacity','0'); td.setAttribute('opacity','0');
    }
  }
  var tip=$('charttip');
  if(tip){
    var d=window._chartData&&window._chartData[pick];
    if(pick<0||!d){ tip.style.display='none'; tip.innerHTML=''; }
    else{
      tip.style.display='block';
      tip.innerHTML=(d.pct===null||d.pct===undefined)
        ? ('<b>'+esc(d.tag)+'</b> · '+esc(String(d.sub||(d.count+' 条'))))
        : ('<b>'+esc(d.tag)+'</b> · '+d.count+' 条 · 占 '+d.pct+'%');
    }
  }
}

/* ============ 横滑提示：能滑的行给个明示，滑过就撤 ============ */
function markScrollables(){
  var rows=document.querySelectorAll('.chips');
  for(var i=0;i<rows.length;i++){
    var box=rows[i];
    if(box.classList.contains('wrapx')) continue;
    var over=(box.scrollWidth-box.clientWidth)>6;
    box.classList.toggle('scrollable',over);
    var atEnd=(box.scrollLeft+box.clientWidth)>=(box.scrollWidth-4);
    box.classList.toggle('at-end',atEnd);
    if(over&&!box._nudge){
      var pn=box.parentNode;
      var flexy=false;
      try{ flexy=pn&&window.getComputedStyle(pn).display==='flex'; }catch(e){}
      if(!flexy){
        var s=document.createElement('div');
        s.className='swipe-hint';
        s.innerHTML='<b>⇄</b> 左右滑，还有更多';
        pn.insertBefore(s,box.nextSibling);
        box._nudge=s;
        box.addEventListener('scroll',function(){
          if(this._nudge) this._nudge.classList.remove('gone');
        },{passive:true});
      }
    }else if(!over&&box._nudge){
      box._nudge.classList.remove('gone');
    }
  }
}

/* ============ 左滑：给文件行挂手势 ============ */
/* 只滑一行；滑开别的行，先前那行自动收回去 */
function closeSwipes(except){
  eachEl('.swipe',function(row){
    if(row===except) return;
    row.classList.remove('open');
    var sl=row.querySelector('.slider');
    if(sl) sl.style.transform='';
  });
}
function bindSwipes(){
  eachEl('.swipe',function(row){
    if(row._sw) return;
    row._sw=true;
    var slider=row.querySelector('.slider');
    if(!slider) return;
    var acts=row.querySelectorAll('.acts .a');
    var W=((acts&&acts.length)||0)*62;   // 露出来的宽度，按动作个数算
    if(!W) return;                       // 这行没动作（在用的 / 注册表），不挂手势
    var sx=0,sy=0,dx=0,dragging=false,decided=false,horiz=false;
    row.addEventListener('touchstart',function(e){
      if(!e.touches||!e.touches.length) return;
      var t=e.touches[0];
      sx=t.clientX; sy=t.clientY; dx=0; dragging=true; decided=false; horiz=false;
      slider.style.transition='none';
    },{passive:true});
    row.addEventListener('touchmove',function(e){
      if(!dragging) return;
      var t=e.touches[0];
      dx=t.clientX-sx;
      var dy=t.clientY-sy;
      if(!decided){
        if(Math.abs(dx)>7||Math.abs(dy)>7){ decided=true; horiz=Math.abs(dx)>Math.abs(dy); }
        else return;
      }
      if(!horiz) return;                 // 竖着滑就让页面滚，别抢
      if(e.cancelable) e.preventDefault();
      var base=row.classList.contains('open')?-W:0;
      var x=base+dx;
      if(x>0) x=0;
      if(x<-W-18) x=-W-18;
      slider.style.transform='translateX('+x+'px)';
    },{passive:false});
    function end(){
      if(!dragging) return;
      dragging=false;
      slider.style.transition='';
      if(!horiz){ slider.style.transform=''; return; }
      var base=row.classList.contains('open')?-W:0;
      var x=base+dx;
      if(x<-W/2){ closeSwipes(row); row.classList.add('open'); slider.style.transform='translateX(-'+W+'px)'; }
      else { row.classList.remove('open'); slider.style.transform=''; }
    }
    row.addEventListener('touchend',end);
    row.addEventListener('touchcancel',end);
  });
}

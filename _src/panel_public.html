/* ============ 存档：读编辑框、落盘 ============ */
function collectEdit(id){
  var box=null;
  eachEl('[data-edit]',function(el){ if(el.getAttribute('data-edit')===id) box=el; });
  if(!box) return null;
  var out={id:id};
  var els=box.querySelectorAll('[data-e]');
  for(var i=0;i<els.length;i++) out[els[i].getAttribute('data-e')]=els[i].value;
  return out;
}

function saveProfileEdit(id){
  var t=collectEdit(id);
  if(!t){ toast('没找到要存的东西'); return false; }
  // 本地先改，界面立刻对得上
  if(S.registry&&S.registry.profiles){
    for(var i=0;i<S.registry.profiles.length;i++){
      if(S.registry.profiles[i].id!==id) continue;
      for(var k in t){ if(k!=='id') S.registry.profiles[i][k]=t[k]; }
    }
  }
  var err='';
  var r=null;
  if(hasFn('saveRegistry')){
    r=call('saveRegistry',[JSON.stringify(S.registry)]);
    if(r&&r.success===false) err=r.error||'';
  }
  if(!r||r.success===false){
    // 退路：单参 updateProfile（JSON 里带 id）
    var r2=call('updateProfile',[JSON.stringify(t)]);
    if(r2&&r2.success===false) err=r2.error||err;
    if(!r2||r2.success===false){ toast('存不上：'+(err||'桥没通')); return false; }
  }
  S.vaultEdit=null;
  if(loadAll()) render();
  toast('存好了');
  return true;
}

/* 删/改/切之后统一收尾：把「切换已有文件」那份缓存作废，重扫一遍。
   上一版主卡那排删完只 render()，下面那份列表是缓存的，删掉的文件还挂着，
   点「用这本」又把它登记回来——看着像删不掉，其实是缓存没作废。 */
function refreshAfterFileChange(){
  S.pickFiles=null; S.pickErr='';
  if(S.pickOpen) loadPickFiles(); else render();
}

/* 这份文件到底还在不在磁盘上——「用这本」复活已删文件前的一道闸。
   桥有 fileExists 就直问；没有就扫一遍目录兜底；都问不出来时放行（不拦路）。 */
function fileExistsSync(rel){
  var full=rel.charAt(0)==='/'?rel:(baseDirOf()+rel);
  if(hasFn('fileExists')){
    var r=call('fileExists',[full]);
    if(r&&typeof r.exists==='boolean') return r.exists;
  }
  var dir=full.replace(/[^\/]+$/,'');
  var r2=call('listJson',[dir]);
  if(r2&&r2.files){
    for(var i=0;i<r2.files.length;i++){ if(r2.files[i].path===full) return true; }
    return false;
  }
  return true;
}

/* 折叠区：翻出 闲逛手记/ 下所有 .json */
function loadPickFiles(){
  S.pickFiles=null; S.pickErr='';
  render();
  var dir=baseDirOf();
  var r=call('listJson',[dir]);
  if(!r||r.success===false||!r.files){
    S.pickFiles=[]; S.pickErr='翻不到目录：'+((r&&r.error)||'桥没通');
    render(); return;
  }
  var out=[];
  for(var i=0;i<r.files.length;i++){
    var f=r.files[i];
    // 注册表是系统件，不摆上台面
    if(String(f.name).toLowerCase()==='profiles.json') continue;
    out.push({name:f.name, path:f.path, rel:shortOf(f.path), size:f.size, mtime:f.mtime});
  }
  S.pickFiles=out;
  render();
}

function useFile(rel){
  var reg=S.registry||{profiles:[]};
  var want=rel.charAt(0)==='/'?rel:(baseDirOf()+rel);
  // 已经登记过的，直接切
  for(var i=0;i<reg.profiles.length;i++){
    if(fullOf(reg.profiles[i])===want){
      var r=call('switchProfile',[reg.profiles[i].id]);
      if(r&&r.success===false){ toast(r.error||'切不了'); return; }
      if(loadAll()) render();
      toast('已切到「'+(reg.profiles[i].name||rel)+'」');
      return;
    }
  }
  // 前端没认出来，先让桥按文件名/路径认一次（桥现在 id、文件名、路径、名字都认）
  var rs=call('switchProfile',[rel]);
  if(rs&&rs.success!==false){ if(loadAll()) render(); toast('已切到这本'); return; }
  // 桥也认不出：先确认这份文件还在不在。不在就别登记——不然刚删掉的档
  // 又被凭空复活一本，看着像删不掉，还能无限循环。
  if(!fileExistsSync(rel)){
    toast('这份文件已经不在了，列表已重新扫描');
    loadAll(); refreshAfterFileChange();
    return;
  }
  // 真的没登记过：登记一本，指到这个文件（不覆盖它）
  var name=rel.replace(/\.json$/i,'');
  var r2=call('addProfile',[JSON.stringify({name:name,data_file:rel})]);
  if(!r2||r2.success===false){ toast('接不上：'+((r2&&r2.error)||'桥没通')); return; }
  var r3=call('switchProfile',[r2.id]);
  if(loadAll()) render();
  toast('接上了：'+rel);
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  // 点到别处，把滑开的文件行收回去
  try{ if(!ev.target.closest('.swipe')) closeSwipes(null); }catch(e0){}
  if(!el) return;
  var act=el.getAttribute('data-act');
  var v=el.getAttribute('data-v');
  var k=el.getAttribute('data-k');
  if(k===null) k=el.getAttribute('data-id');

  switch(act){
    case 'tab': S.tab=v; render(); break;
    case 'star-mode':
      S.starMode=(S.starMode==='plain'?'star':'plain');
      try{ localStorage.setItem('xg_star_mode',S.starMode); }catch(e){}
      render(); break;
    case 'star-tap':
      S.starSel=(S.starSel===v?'':v); render(); break;
    case 'wf-save':
      (function(){
        var ta=document.querySelector('textarea[data-wf="'+v+'"]');
        var txt=ta?ta.value:'';
        var r=call('saveWfPrompt',[JSON.stringify({id:v,message:txt})]);
        if(S.wfPrompts){ for(var wi=0;wi<S.wfPrompts.length;wi++){ if(S.wfPrompts[wi].id===v) S.wfPrompts[wi].message=txt; } }
        toast(r&&r.success===false?('存不上：'+(r.error||'')):'这段存好了，下一趟按新的走');
      })();
      break;
    case 'act-group': S.actGroup=v; render(); break;
    case 'wf-reload':
      (function(){
        var r=call('getWfPrompts',[]);
        if(r&&r.success){ S.wfPrompts=r.prompts||[]; S.wfDraft={}; render(); toast('读到 '+(S.wfPrompts.length)+' 段'); }
        else { toast(r&&r.pending?'再点一次，正在读':'读不到：'+((r&&r.error)||'?')); }
      })();
      break;
    case 'p-open':
      if(!S.pOpen) S.pOpen={};
      S.pOpen[v]=(S.pOpen[v]?false:true);
      render(); break;
    case 'sched-ok':
      (function(){
        var d=S.schedDraft||{};
        var keys=['interval_hours','max_items_per_trip','active_start','active_end'];
        if(!S.data.schedule) S.data.schedule={};
        var s=S.data.schedule, changed=false, touched=false;
        for(var i=0;i<keys.length;i++){
          var k=keys[i];
          if(d[k]===undefined) continue;
          var v=Number(d[k]);
          if(isNaN(v)) continue;
          touched=true;
          if(k==='interval_hours'||k==='max_items_per_trip'){ if(v<1) v=1; }
          else { v=Math.max(0,Math.min(23,Math.round(v))); }
          if(s[k]!==v){ s[k]=v; changed=true; }
        }
        var tEl=document.querySelector('[data-txt="chat_title"]');
        if(tEl){
          var tv=String(tEl.value||'').replace(/^\s+|\s+$/g,'');
          if(!tv) tv='AI 和用户的日常';
          if(s.chat_title!==tv){ s.chat_title=tv; changed=true; touched=true; }
        }
        S.schedDraft={};
        if(touched) save();
        if(window.syncSched) window.syncSched();
        render();
        toast(touched?('存好了：每 '+s.interval_hours+' 小时，'+s.active_start+'–'+s.active_end+' 点之间 · 投到「'+(s.chat_title||'')+'」'):'没改动，只同步了一遍');
      })();
      break;
    case 'sp-save':
      (function(){
        var capEl=document.querySelector('[data-sp="cap"]');
        var biasEl=document.querySelector('[data-sp="bias"]');
        var cap=parseInt(capEl?capEl.value:'3',10); if(isNaN(cap)||cap<0)cap=3;
        var bias=parseInt(biasEl?biasEl.value:'50',10); if(isNaN(bias))bias=50;
        var r=call('saveSpeechPrefs',[JSON.stringify({cap:cap,bias:bias})]);
        if(!r){ toast('桥里没有保存口——插件得重启一次才认'); return; }
        if(r.success===false){ toast('存不上：'+(r.error||'?')); return; }
        if(S.data){S.data.preferences=S.data.preferences||{};S.data.preferences.speech_cap=r.cap;S.data.preferences.dive_bias=r.bias;}
        toast('存好了：上限 '+r.cap+' · 倾向 '+r.bias+'%');
      })();
      break;
    case 'wf-run':
      (function(){
        var r=call('triggerWf',[]);
        toast(r&&r.success===false?('跑不动：'+(r.error||'')):'叫它出门了——过会儿看账本');
      })();
      break;
    case 'reload':
      if(loadAll()){ render(); toast('账本已刷新'); }
      break;

    /* 手记 */
    case 'toggle-rec':
      S.openRec[k]=!S.openRec[k];
      rerenderNotes();
      setTimeout(function(){ var w=document.querySelector('.swipe-wrap[data-swipe="'+k+'"]'); if(w) fitSwipe(w); },60);
      break;
    case 'flip':
      var fw=document.querySelector('.swipe-wrap[data-swipe="'+k+'"]');
      if(fw){ flipCard(fw, !fw.classList.contains('on-diary')); }
      break;
    case 'cal-prev': S.calM=(S.calM===undefined||S.calM===null)?(new Date()).getMonth():S.calM; if(S.calM===0){S.calM=11;S.calY=(S.calY||(new Date()).getFullYear())-1;}else{S.calM--;} S.calY=S.calY||(new Date()).getFullYear(); rerenderNotes(); break;
    case 'cal-next': S.calM=(S.calM===undefined||S.calM===null)?(new Date()).getMonth():S.calM; if(S.calM===11){S.calM=0;S.calY=(S.calY||(new Date()).getFullYear())+1;}else{S.calM++;} S.calY=S.calY||(new Date()).getFullYear(); rerenderNotes(); break;
    case 'cal-pick': S.dateFilter=v; S.showAll=false; rerenderNotes(); break;
    case 'cal-clear': S.dateFilter=''; rerenderNotes(); break;
    case 'show-all': S.showAll=true; rerenderNotes(); break;
    case 'show-less': S.showAll=false; rerenderNotes(); break;
    case 'range': S.range=v; rerenderNotes(); break;
    case 'sort': S.sort=v; rerenderNotes(); break;
    case 'clear-q': S.q=''; var qi=$('q'); if(qi){qi.value='';} var sb=$('searchbox'); if(sb){sb.classList.remove('has');} rerenderNotes(); break;
    case 'urge':
      S.data.manual_request={ts:Date.now(),by:'user'};
      save(); render(); toast('记下了——下次醒来，第一件事就是出门逛'); break;

    /* 链接 */
    case 'open':
      var r1=call('openUrl',[el.getAttribute('data-url')]);
      if(r1&&r1.success===false) toast('打不开：'+(r1.error||''));
      break;
    case 'copy':
      var r2=call('copyText',[el.getAttribute('data-txt')]);
      toast(r2&&r2.success===false?('复制失败：'+r2.error):'复制好了'); break;

    /* 设置 */
    case 't-sched':
      S.data.schedule.enabled=!S.data.schedule.enabled; save(); if(window.syncSched) window.syncSched(); render(); break;
    case 't-plat-en':
      (function(){
        var i=Number(k);
        if(!S.data.platforms[i]) return;
        S.data.platforms[i].enabled=!S.data.platforms[i].enabled;
        save(); render();
      })();
      break;
    case 't-perm':
      (function(){
        var p=k.split('|'); var i=Number(p[0]), pk=p[1];
        if(!S.data.platforms[i]) return;
        if(!S.data.platforms[i].permissions) S.data.platforms[i].permissions={};
        S.data.platforms[i].permissions[pk]=!S.data.platforms[i].permissions[pk];
        save(); render();
      })();
      break;
    case 't-online':
      (function(){
        var i=Number(k);
        if(!S.data.platforms[i]) return;
        var a=S.data.platforms[i].account;
        a.online=!a.online;
        if(a.online) a.login_at=Date.now(); else a.logout_at=Date.now();
        save(); render();
      })();
      break;
    case 'toggle-plat': S.openPlat[k]=!S.openPlat[k]; render(); break;
    case 'acct-mode':
      (function(){
        var p=k.split('|'); var i=Number(p[0]);
        if(!S.data.platforms[i]) return;
        S.data.platforms[i].account.mode=p[1];
        save(); render();
      })();
      break;
    case 'add-plat':
      S.data.platforms.push({
        id:'custom_'+Date.now(), name:'新平台', enabled:true, adapter:'', homepage:'', owner_note:'',
        permissions:{like:false,dislike:false,comment:false,delete_comment:false,favorite:false,unfavorite:false,dm_reply:false,public_reply:false,follow:false,unfollow:false,publish:false},
        account:{mode:'guest',login_url:'',username:'',password:'',cookie:'',token:'',token_note:'',online:false,login_at:0,logout_at:0}
      });
      save(); render(); toast('加了个新平台，点开给它改个名字'); break;
    case 'del-plat':
      S.pendingDelete={kind:'plat',idx:Number(k)};
      confirmModal('移除这个平台？','移除后它下面的权限和账号设置一起没了。账本里已经记下的手记不受影响。',function(){
        S.data.platforms.splice(Number(k),1);
        save(); render(); toast('平台已移除');
      });
      break;

    /* 统计 */
    case 'chart': S.chart=v; S.chartPick=-1; render(); break;
    case 'tag-all': S.tagAll=!S.tagAll; render(); break;
    case 'chartrange': S.chartRange=v; S.chartPick=-1; render(); break;
    case 'chartpick':
      (function(){
        var ci=Number(v);
        S.chartPick=(S.chartPick===ci?-1:ci);
        applyChartPick();
      })();
      break;
    case 'add-utag':
      var t=(S.newTag||'').trim();
      if(!t){ toast('先写个标签名'); break; }
      S.data.preferences.user_tags.push({tag:t,weight:1});
      S.newTag=''; save(); render(); toast('加好了：'+t); break;
    case 'del-utag':
      S.data.preferences.user_tags.splice(Number(k),1); save(); render(); break;
    case 'add-btag':
      var tb=(S.blockDraft||'').trim();
      if(!tb){ toast('先写个标签名'); break; }
      if(S.data.preferences.blocked_tags.indexOf(tb)<0) S.data.preferences.blocked_tags.push(tb);
      S.blockDraft=''; save(); render(); toast('拉黑了：'+tb); break;
    case 'del-btag':
      S.data.preferences.blocked_tags.splice(Number(k),1); save(); render(); break;

    /* 记忆 */
    case 'mem-mode':
      S.data.memory.mode=v; save(); render();
      toast(v==='keep'?'切到永不遗忘——以后不删了':'切回遗忘模式'); break;
    case 't-mem':
      S.data.memory[k]=!S.data.memory[k]; save(); render(); break;
    case 'mem-save': save(); toast('记忆设置已保存'); break;
    case 'mem-reset':
      S.data.memory.retention_days=7; S.data.memory.blur=0.3;
      S.data.memory.compress=true; S.data.memory.compress_threshold=0.45;
      S.data.memory.forget_threshold=0.15; S.data.memory.auto_tick=true;
      save(); render(); toast('已恢复默认');
      break;
    case 'mem-fold':
      var ft=document.querySelector('.mem .txt[data-id="'+k+'"]');
      var fa=document.querySelector('.mem .fold[data-k="'+k+'"]');
      if(ft){ ft.classList.toggle('clamped'); if(fa) fa.textContent=ft.classList.contains('clamped')?'▾':'▴'; }
      break;
    case 'mem-show-all': S.memShowAll=!S.memShowAll; render(); break;
    case 'rule-reset': S.data.preferences.diary_rule=''; save(); render(); toast('已恢复默认规则'); break;
    case 'mem-tick':
      var mr=call('memoryTick');
      if(mr&&mr.success!==false){
        toast('走完了：'+mr.total+' 条，待压缩 '+mr.to_compress+'，待遗忘 '+mr.to_forget);
        if(loadAll()) render();
      }else toast('走不动：'+((mr&&mr.error)||''));
      break;
    case 'mem-import':
      var ir=call('importMemory',[JSON.stringify({force:false})]);
      if(!ir||ir.success===false){ toast('开不动：'+((ir&&ir.error)||'')); break; }
      toast('开始倒了——跑完会说');
      var hint=$('mem-import-hint');
      if(hint) hint.textContent='正在导入…';
      var tries=0;
      var timer=setInterval(function(){
        tries++;
        var st=call('importMemoryStatus');
        if(!st||st.success===false){ clearInterval(timer); if(hint) hint.textContent='查不到进度'; return; }
        if(st.running){
          if(hint) hint.textContent='正在导入…（'+tries+' 秒）';
          if(tries>180){ clearInterval(timer); if(hint) hint.textContent='跑了很久，先歇着，回头再点一次就行'; }
          return;
        }
        clearInterval(timer);
        var rr=st.result||{};
        var msg=rr.message||rr.error||'跑完了';
        if(hint) hint.textContent=msg;
        toast(msg);
      },1000);
      break;
    case 'del-mem':
      confirmModal('删掉这条记忆？','删了就是真没了。手记里那条记录还在，但「当时的感受」这一份会消失。',function(){
        var r=call('deleteMemory',[el.getAttribute('data-id')]);
        if(r&&r.success===false) toast(r.error||'删不了');
        else { if(loadAll()) render(); toast('忘了'); }
      });
      break;

    /* 存档 */
    case 'use-pf':
      var ur=call('switchProfile',[k]);
      if(ur&&ur.success===false) toast(ur.error||'切不了');
      else { if(loadAll()) render(); toast('已切到这本'); }
      break;
    case 'edit-pf': S.vaultEdit=(S.vaultEdit===k?null:k); render(); break;
    case 'save-pf': saveProfileEdit(k); break;
    case 'toggle-pick':
      S.pickOpen=!S.pickOpen;
      if(S.pickOpen) loadPickFiles(); else { S.pickFiles=null; render(); }
      break;
    case 'use-file': useFile(k); break;
    case 'add-pf': S.addProfileModal=true; openAddProfile(); break;
    case 'pick-card':
      // 点角色卡名 → 只把它填进「绑哪个角色卡」那一栏，存不存由您按「保存」
      (function(){
        var box=null;
        eachEl('[data-edit]',function(el){ if(el.getAttribute('data-edit')===k) box=el; });
        if(!box) return;
        var els=box.querySelectorAll('[data-e]');
        for(var i=0;i<els.length;i++){
          if(els[i].getAttribute('data-e')==='card_name'){ els[i].value=v; break; }
        }
        toast('填上了，记得按「保存」');
      })();
      break;
    case 'del-pf':
      var pf=null;
      for(var pi=0;pi<S.registry.profiles.length;pi++) if(S.registry.profiles[pi].id===k) pf=S.registry.profiles[pi];
      openDeleteProfile(k, (pf&&pf.name)||'这本');
      break;
    case 'del-pf-soft':
      closeModal(); doDeleteProfile(k,'keep'); break;
    case 'del-pf-hard':
      closeModal(); doDeleteProfile(k,'hard'); break;

    /* 文件行左滑：改名 / 删除 */
    case 'rename-file':
      openRenameFile(k, el.getAttribute('data-name')||'');
      break;
    case 'rename-ok':
      (function(){
        var fld=$('rf_name');
        var nm=fld?(fld.value||'').trim():'';
        if(!nm){ toast('名字不能空'); return; }
        var r=call('renameFile',[JSON.stringify({path:k,name:nm})]);
        closeModal();
        if(r&&r.success===false){ toast('改不了：'+(r.error||'')); return; }
        loadAll(); refreshAfterFileChange();
        toast('改好了：'+((r&&r.rel)||nm));
      })();
      break;
    case 'del-file':
      openDeleteFile(k, el.getAttribute('data-name')||String(k).split('/').pop());
      break;
    case 'del-file-soft':
      closeModal(); doDeleteFile(k,'keep'); break;
    case 'del-file-hard':
      closeModal(); doDeleteFile(k,'hard'); break;

    /* 备份 / 导入 */
    case 'exp-block':
      S.expBlocks=S.expBlocks||[];
      (function(){
        var i=S.expBlocks.indexOf(v);
        if(i>=0) S.expBlocks.splice(i,1); else S.expBlocks.push(v);
        render();
      })();
      break;
    case 'backup-all':
      var b1=call('backup',[bkArg(null,'manual')]);
      if(b1&&b1.path){ toast('导好了：'+String(b1.path).split('/').pop()); if(loadAll()) render(); }
      else toast('导出失败'+((b1&&b1.error)?('：'+b1.error):''));
      break;
    case 'backup-blocks':
      if(!(S.expBlocks||[]).length){ toast('先勾几块'); break; }
      var b2=call('backup',[bkArg(S.expBlocks||[],'block')]);
      if(b2&&b2.path){ toast('导好了：'+String(b2.path).split('/').pop()); if(loadAll()) render(); }
      else toast('导出失败'+((b2&&b2.error)?('：'+b2.error):''));
      break;
    case 'imp-path':
      (function(){
        var el2=$('imp_path');
        var p=el2?(el2.value||'').trim():'';
        if(!p){ toast('先填个路径'); return; }
        doImportFrom(p);
      })();
      break;
    case 'imp-scan':
      (function(){
        var dir = v==='download' ? '/storage/emulated/0/Download' : '/storage/emulated/0/Download/Operit/闲逛手记/backup';
        var r=call('listJson',[dir]);
        var box=$('imp_files');
        if(!box) return;
        if(!r){ box.innerHTML='<div class="muted" style="margin-top:8px">桥没通——装上 v0.4.2 再试</div>'; return; }
        var files=(r&&r.files)||[];
        if(!files.length){ box.innerHTML='<div class="muted" style="margin-top:8px">这个目录下没找到 .json</div>'; return; }
        var h2='<div class="filelist">';
        for(var i=0;i<files.length;i++){
          h2+='<div class="frow"><div class="fn">'+esc(files[i].name)+'</div>'
            +'<div class="fs">'+fmtStamp(files[i].mtime)+' · '+fmtSize(files[i].size)+'</div>'
            +'<button class="btn sm pri" data-act="imp-file" data-k="'+esc(files[i].path)+'">导入</button></div>';
        }
        box.innerHTML=h2+'</div>';
      })();
      break;
    case 'imp-file':
      doImportFrom(k);
      break;
    case 'imp-mode': S.impMode=v; render(); break;
    case 'imp-block':
      S.impBlocks=S.impBlocks||[];
      (function(){
        var i=S.impBlocks.indexOf(v);
        if(i>=0) S.impBlocks.splice(i,1); else S.impBlocks.push(v);
        render();
      })();
      break;
    case 'do-import':
      if(oldBridgeWarn()) break;
      confirmModal('导入这份备份？',
        '会按勾选的块写进当前这本手记。动手前会自动导出备份，出错能退。',
        function(){
          var mode=S.impMode||'replace';
          var blocks=(S.impBlocks&&S.impBlocks.length)?S.impBlocks:null;
          var r=call('importBackup',[JSON.stringify({path:k,blocks:blocks,mode:mode})]);
          if(r&&r.success===false) toast('导不进：'+(r.error||''));
          else { if(loadAll()) render(); toast('导好了，底也留了一份'); }
        });
      break;
    case 'del-backup':
      confirmModal('删掉这份备份？','删了就真没了。',function(){
        call('deleteBackup',[k]);
        if(loadAll()) render();
        toast('删了');
      });
      break;
    case 'modal-cancel':
      closeModal(); break;
    case 'modal-ok':
      var fn=window._modalOk;
      closeModal();
      if(typeof fn==='function') fn();
      break;
  }
});

/* ============ 弹窗 ============ */
/* 导入要单参 JSON，只有 0.4.3 起的桥认；老桥就直说，别让它装作失败 */
function oldBridgeWarn(){
  if(verAtLeast(S.bridgeVer,'0.4.3')) return false;
  toast('桥还是旧版（'+(S.bridgeVer||'未知')+'）——把侧栏重开一次再导');
  return true;
}
function doImportFrom(path){
  if(!path) return;
  if(oldBridgeWarn()) return;
  confirmModal('导入这份文件？',
    '会按勾选的块写进当前这本手记。动手前会自动导出备份，出错能退。',
    function(){
      var mode=S.impMode||'replace';
    var blocks=(S.impBlocks&&S.impBlocks.length)?S.impBlocks:null;
    var r=call('importBackup',[JSON.stringify({path:path,blocks:blocks,mode:mode})]);
      if(r&&r.success===false) toast('导不进：'+(r.error||''));
      else { if(loadAll()) render(); toast('导好了，底也留了一份'); }
    });
}

function confirmModal(title,desc,onOk){
  closeModal();
  var m=document.createElement('div');
  m.className='mask';
  m.id='mask';
  m.innerHTML='<div class="modal"><h3>'+esc(title)+'</h3>'
    +'<div class="dangerbox"><div class="t">这一步不好回头</div><div class="d">'+esc(desc)+'</div></div>'
    +'<div class="acts"><button class="btn ghost" data-act="modal-cancel">再想想</button>'
    +'<button class="btn danger" data-act="modal-ok">确定</button></div></div>';
  document.body.appendChild(m);
  window._modalOk=onOk;
}
function closeModal(){
  var m=$('mask');
  if(m) m.parentNode.removeChild(m);
  window._modalOk=null;
}

function openRenameFile(path, curName){
  closeModal();
  var m=document.createElement('div');
  m.className='mask'; m.id='mask';
  m.innerHTML='<div class="modal"><h3>给这份文件改个名</h3>'
    +'<label class="f">文件名（.json）</label>'
    +'<input type="text" id="rf_name" value="'+esc(curName||'')+'" />'
    +'<div class="hint">只改文件名，里面的手记一个字不碰。注册表里指着它的那本会一起改过来，不会失联。</div>'
    +'<div class="acts" style="margin-top:14px"><button class="btn ghost" data-act="modal-cancel">算了</button>'
    +'<button class="btn pri" data-act="rename-ok" data-k="'+esc(path)+'">改名</button></div></div>';
  document.body.appendChild(m);
  var f=$('rf_name');
  if(f){ try{ f.focus(); if(f.select) f.select(); }catch(e){} }
}

/* 删文件：两种删法让用户挑——留痕删（先备份）/ 直接删（不留底） */
function openDeleteFile(path, nm){
  closeModal();
  var m=document.createElement('div');
  m.className='mask'; m.id='mask';
  m.innerHTML='<div class="modal"><h3>删掉「'+esc(nm||'这份文件')+'」？</h3>'
    +'<div class="dangerbox"><div class="t">这一步不好回头</div>'
    +'<div class="d">两种删除方式：留痕删会先整份抄进 backup/ 留底；直接删不留底，删掉即不可恢复。</div></div>'
    +'<div class="acts" style="margin-top:12px;gap:8px;flex-wrap:wrap">'
    +'<button class="btn ghost" data-act="modal-cancel">再想想</button>'
    +'<button class="btn pri" data-act="del-file-soft" data-k="'+esc(path)+'">留痕删除</button>'
    +'<button class="btn danger" data-act="del-file-hard" data-k="'+esc(path)+'">直接删除</button>'
    +'</div></div>';
  document.body.appendChild(m);
}

function doDeleteFile(path, mode){
  var r=call('deleteFile',[JSON.stringify({path:path,mode:mode})]);
  if(r&&r.success===false){ toast('删不了：'+(r.error||'')); return; }
  loadAll();
  refreshAfterFileChange();
  var extra=(r&&r.detached)?('，连带摘掉 '+r.detached+' 本'):'';
  toast(mode==='hard'?('删了，没留底'+extra):('移走了，底留在 backup/'+extra));
}

/* 删一本手记：跟删文件一个规矩——两种删法让用户挑 */
function openDeleteProfile(id, nm){
  closeModal();
  var m=document.createElement('div');
  m.className='mask'; m.id='mask';
  m.innerHTML='<div class="modal"><h3>删掉「'+esc(nm||'这本')+'」？</h3>'
    +'<div class="dangerbox"><div class="t">这一步不好回头</div>'
    +'<div class="d">这本会从列表里摘掉，它的数据文件也一并清掉。两种删除方式：留痕删会先把整本抄进 backup/ 留底；直接删不留底，删掉即不可恢复。</div></div>'
    +'<div class="acts" style="margin-top:12px;gap:8px;flex-wrap:wrap">'
    +'<button class="btn ghost" data-act="modal-cancel">再想想</button>'
    +'<button class="btn pri" data-act="del-pf-soft" data-k="'+esc(id)+'">留痕删除</button>'
    +'<button class="btn danger" data-act="del-pf-hard" data-k="'+esc(id)+'">直接删除</button>'
    +'</div></div>';
  document.body.appendChild(m);
}

function doDeleteProfile(id, mode){
  var r=call('removeProfile',[JSON.stringify({id:id,mode:mode})]);
  if(r&&r.success===false){ toast('删不了：'+(r.error||'')); return; }
  loadAll();
  refreshAfterFileChange();
  var extra=(r&&r.shared)?'（数据文件还有别的本在用，没动它）':'';
  toast(mode==='hard'?('直接删了，没留底'+extra):('留痕删了，底在 backup/'+extra));
}

function openAddProfile(){
  closeModal();
  var cards=(S.cards||[]);
  var ch='';
  for(var i=0;i<cards.length;i++){
    ch+='<span class="chip" data-act="newpf-card" data-v="'+esc(cards[i].name)+'">'+esc(cards[i].name)+'</span>';
  }
  var m=document.createElement('div');
  m.className='mask'; m.id='mask';
  m.innerHTML='<div class="modal"><h3>新起一本手记</h3>'
    +'<label class="f">叫什么</label><input type="text" id="np_name" placeholder="比如：另一个 AI" />'
    +'<label class="f">绑哪个角色卡</label><input type="text" id="np_card" placeholder="写角色卡名" />'
    +(ch?('<div class="chips" style="margin-top:6px">'+ch+'</div>'):'')
    +'<label class="f">出门逛时的口吻</label><textarea rows="2" id="np_persona" placeholder="比如：话少，爱看旧东西。"></textarea>'
    +'<div class="hint">新这本会另起一个数据文件，跟现在这本互不打扰。</div>'
    +'<div class="acts" style="margin-top:14px"><button class="btn ghost" data-act="modal-cancel">算了</button>'
    +'<button class="btn pri" data-act="newpf-ok">建</button></div></div>';
  document.body.appendChild(m);
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el) return;
  var act=el.getAttribute('data-act');
  if(act==='newpf-card'){
    var f=$('np_card'); if(f) f.value=el.getAttribute('data-v');
  }
  if(act==='newpf-ok'){
    var name=($('np_name')&&$('np_name').value||'').trim()||'新存档';
    var card=($('np_card')&&$('np_card').value||'').trim();
    var persona=($('np_persona')&&$('np_persona').value||'').trim();
    var r=call('addProfile',[JSON.stringify({name:name,card_name:card,persona:persona})]);
    closeModal();
    if(r&&r.success===false) toast('建不了：'+(r.error||''));
    else { if(loadAll()) render(); toast('新起了一本：'+name); }
  }
});

/* ============ 启动 ============ */
var _bootTry=0;
function boot(){
  if(!loadAll()){
    _bootTry++;
    if(_bootTry<=4){ setTimeout(boot,500); return; }
    var app=$('app');
    if(app) app.innerHTML='<div class="empty" style="padding-top:70px"><div class="big">🔌</div>'
      +'<p>没连上账本（JS 桥没通）</p>'
      +'<p style="font-size:12px;margin-top:10px">多半是插件没重装。重装一次「闲逛手记」，或把这页关掉再进来。</p></div>';
    return;
  }
  // 桥自检：把可用/缺失的方法写进插件日志，下回一出问题一眼看得见
  try{
    var want=['load','save','saveRegistry','switchProfile','addProfile','updateProfile','removeProfile',
      'backup','listBackups','listJson','readBackup','deleteBackup','renameFile','deleteFile','importBackup','memoryTick','deleteMemory',
      'openUrl','copyText','listCards','ping'];
    var have=[],miss=[];
    for(var i=0;i<want.length;i++){ if(hasFn(want[i])) have.push(want[i]); else miss.push(want[i]); }
    var pg=hasFn('ping')?call('ping'):null;
    S.bridgeVer=(pg&&pg.version)||'';
    var sh=hasFn('shape')?call('shape',['{"probe":1}']):null;
    if(sh&&sh.success!==false){
      S.bridgeShape=(sh.aIsArr?('数组'+sh.aLen):(sh.aType||'?'))+(sh.obj?'/认对象':'/不认对象');
    } else { S.bridgeShape='桥无 shape 方法（旧桥）'; }
    call('log',['桥自检 版本='+((pg&&pg.version)||'?')+' 参数形态='+S.bridgeShape+' 有('+have.length+'):'+have.join(',')+' 缺('+miss.length+'):'+miss.join(',')]);
  }catch(e){}
  render();
  // 定时软刷新：让「上次上线/下线」跟着账本走。正在打字或开着弹窗时不打断。
  if(!window.__softTimer){
    window.__softTimer=setInterval(function(){
      try{
        var ae=document.activeElement;
        if(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)) return;
        if(document.getElementById('mask')) return;
        if(loadAll()) render();
      }catch(e){}
    },60000);
  }
}
/* 整页翻页：手势 + 点提示条 */
function fitSwipe(w){
  /* 换页改用 display，高度自己跟，不锁死 */
  try{ w.style.height=''; }catch(e){}
}
function fitAllSwipes(){
  try{
    var ws=document.querySelectorAll('.swipe-wrap');
    for(var i=0;i<ws.length;i++) fitSwipe(ws[i]);
  }catch(e){}
}
document.addEventListener('touchstart',function(e){
  var t=e.target, w=t&&t.closest?t.closest('.swipe-wrap'):null;
  if(w) w._sx=e.touches[0].clientX;
},true);
document.addEventListener('touchend',function(e){
  var t=e.target, w=t&&t.closest?t.closest('.swipe-wrap'):null;
  if(!w) return;
  var dx=e.changedTouches[0].clientX-(w._sx||0);
  if(Math.abs(dx)<60) return;
  flipCard(w, dx<0);
},true);
window.__fitSwipe=fitSwipe;
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>
</body>
</html>
